name: dispatch-to-marketplace

# Manual recovery tool. The normal release flow (release.yml) dispatches to
# the marketplace itself. Use this only when:
#   - The marketplace dispatch step in release.yml failed and you want to
#     retry without re-running the whole build.
#   - You need to re-publish an existing release to the marketplace (e.g.
#     after the marketplace.json schema changed).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to dispatch (e.g. agent-chrome-wrapper--v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          # Tag format: <plugin-name>--v<version>. Strip everything up to and including "--v".
          VERSION="${TAG##*--v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      # marketplace-payload.sh lives on `main`, never on the orphan `release`
      # branch (which carries only install-ready files, no `.github/`) --
      # sparse-checked-out into a side directory so it doesn't collide with
      # the `release` branch checkout above.
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: .main-scripts
          sparse-checkout: .github/scripts

      - name: Verify plugin.json version matches tag
        shell: bash
        run: |
          PJ_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PJ_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::plugin.json on release branch is v$PJ_VERSION, but you asked to dispatch v$TAG_VERSION."
            echo "Re-run release.yml with version=$TAG_VERSION (or re-check the release branch state)."
            exit 1
          fi

      - name: Read plugin metadata from plugin.json
        id: meta
        shell: bash
        run: |
          DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)
          echo "description=${DESC}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}"        >> "$GITHUB_OUTPUT"

      - name: Fetch changelog for dispatch
        shell: bash
        env:
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TAG:            ${{ steps.tag.outputs.tag }}
          CHANGELOG_FILE: ${{ runner.temp }}/changelog.md
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q '.body // empty' > "$CHANGELOG_FILE" || echo "::warning::gh release view failed for $TAG; changelog will be omitted"

      - name: Dispatch to agent-marketplace
        env:
          GH_PAT:         ${{ secrets.ECOSYSTEM_TOKEN }}
          NAME:           ${{ steps.meta.outputs.name }}
          DESC:           ${{ steps.meta.outputs.description }}
          VERSION:        ${{ steps.tag.outputs.version }}
          TAG:            ${{ steps.tag.outputs.tag }}
          REPO:           ${{ github.repository }}
          CHANGELOG_FILE: ${{ runner.temp }}/changelog.md
          PAYLOAD_FILE:   ${{ runner.temp }}/payload.json
        shell: bash
        run: |
          bash .main-scripts/.github/scripts/marketplace-payload.sh
          # Staging first (lands straight to main, no review), then the
          # curated marketplace (opens a review PR) -- same payload file,
          # two independent dispatches.
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory-staging/dispatches \
            -d @"$PAYLOAD_FILE"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory/dispatches \
            -d @"$PAYLOAD_FILE"
